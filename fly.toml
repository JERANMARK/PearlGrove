app = "pearlgrove"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "10000"

[[services]]
  protocol = "tcp"
  internal_port = 10000

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[deploy]
  release_command = ""
